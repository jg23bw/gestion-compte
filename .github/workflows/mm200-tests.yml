name: Application tests

on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'technical-indicators.js'
      - 'src/**'
      - 'package.json'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'refactor/**'
    paths:
      - 'app.js'
      - 'index.html'
      - 'technical-indicators.js'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
